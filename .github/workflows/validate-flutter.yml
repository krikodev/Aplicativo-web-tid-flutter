name: Validar Flutter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener código
        uses: actions/checkout@v5
      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Flutter estable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Descargar dependencias
        run: flutter pub get
      - name: Analizar Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Ejecutar pruebas
        run: flutter test
      - name: Compilar APK de pruebas
        run: flutter build apk --debug
