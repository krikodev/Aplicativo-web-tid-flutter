name: Validar Flutter

on:
  push:
    branches:
      - fix/busqueda-ruc-credito-20261110
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Flutter estable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Descargar dependencias
        run: flutter pub get
      - name: Analizar Dart
        run: flutter analyze
      - name: Ejecutar pruebas
        run: flutter test
      - name: Compilar APK de pruebas
        run: flutter build apk --debug
